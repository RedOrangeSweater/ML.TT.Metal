name: "Release ttnn-shutov (from-source at Merge pin)"
run-name: "ttnn-shutov from-source (${{ inputs.publish_target }})"

# Build a manylinux ttnn wheel from the Merge pin (default 8dfb324099a),
# repack as ttnn-shutov, optionally publish. Default is artifact-only.
#
# Does NOT use Tenstorrent harbor / tt-ubuntu-* runners (unavailable on this fork).
# auditwheel AND patchelf are DISABLED: on this pin both corrupt ELF (.init/.plt
# leave the executable LOAD) and import ttnn SIGSEGV (see Actions runs
# 29038178511 / 29046417280). tools/bundle_ttnn_runtime_libs.py is copy-only:
# it adds libtracy.so.0.10.0 under ttnn/build/lib and leaves every pre-existing
# ELF byte-identical. OpenMPI/hwloc stay as system/image runtime deps
# (/opt/openmpi-v5.0.7-ulfm). Platform tag is retagged to manylinux_2_34_x86_64
# after a green in-container smoke + ELF invariant gate.

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: "none = artifact only; testpypi / pypi = upload after smoke"
        required: true
        default: none
        type: choice
        options:
          - none
          - testpypi
          - pypi
      publish_version:
        description: "ttnn-shutov PEP 440 version (local +g SHA for pin transparency)"
        required: true
        default: "0.65.0.dev20251204+g8dfb324099"
        type: string
      metal_sha:
        description: "tt-metal commit to build (Merge pin)"
        required: true
        default: "8dfb324099a1bf6b8839cffd5740e22a4d621385"
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-repack:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout workflow tip (tools + history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout Merge pin + submodules
        run: |
          set -euxo pipefail
          git checkout "${{ inputs.metal_sha }}"
          git submodule update --init --recursive
          echo "HEAD=$(git rev-parse HEAD)"
          git describe --tags --always

      - name: Harden Dockerfile.manylinux (OMPI -j + clang)
        run: |
          set -euxo pipefail
          # Cap OpenMPI parallelism (OOM on GitHub-hosted / memory-limited builds).
          if grep -q 'make -j\$(nproc)' dockerfile/Dockerfile.manylinux; then
            sed -i 's/make -j\$(nproc)/make -j${OMPI_MAKE_JOBS:-2}/' dockerfile/Dockerfile.manylinux
          fi
          # Ensure ARG exists near OMPI section
          if ! grep -q 'ARG OMPI_MAKE_JOBS' dockerfile/Dockerfile.manylinux; then
            sed -i '/ARG OMPI_PREFIX=/a ARG OMPI_MAKE_JOBS=2' dockerfile/Dockerfile.manylinux || \
              sed -i '1a ARG OMPI_MAKE_JOBS=2' dockerfile/Dockerfile.manylinux
          fi
          # OpenMPI 5.0.7 fails with GCC 14+ (req_complete = false). Dockerfile sets
          # CC=clang only AFTER the OMPI RUN; force clang for configure/make.
          if ! grep -q 'CC=clang CXX=clang++ ./configure' dockerfile/Dockerfile.manylinux; then
            sed -i 's|    ./configure \\|    CC=clang CXX=clang++ ./configure \\|' dockerfile/Dockerfile.manylinux
          fi
          grep -n 'make -j\|OMPI_MAKE_JOBS\|CC=clang\|configure' dockerfile/Dockerfile.manylinux | head -30

      - name: Skip Tracy tools when ENABLE_TRACY=OFF
        run: |
          set -euxo pipefail
          # Pin checkout may not have tools/; restore patcher from workflow tip first.
          git checkout "${{ github.sha }}" -- tools/patch_tracy_skip_tools.py || true
          if [ ! -f tools/patch_tracy_skip_tools.py ]; then
            git show origin/main:tools/patch_tracy_skip_tools.py > tools/patch_tracy_skip_tools.py
          fi
          python3 tools/patch_tracy_skip_tools.py
          grep -n "LOCAL_SKIP_TRACY_TOOLS\|endif() # ENABLE_TRACY" cmake/tracy.cmake | head

      - name: Restore packaging tools from workflow tip
        run: |
          set -euxo pipefail
          # Pin checkout removed tools/ added on the release branch; restore from the dispatch ref.
          git checkout "${{ github.sha }}" -- \
            tools/repack_ttnn_shutov_wheel.py \
            tools/retag_wheel_platform.py \
            tools/bundle_ttnn_runtime_libs.py \
            tools/check_ttnn_elf_invariant.py || true
          if [ ! -f tools/repack_ttnn_shutov_wheel.py ]; then
            git show origin/main:tools/repack_ttnn_shutov_wheel.py > tools/repack_ttnn_shutov_wheel.py
          fi
          if [ ! -f tools/retag_wheel_platform.py ]; then
            git show origin/main:tools/retag_wheel_platform.py > tools/retag_wheel_platform.py
          fi
          if [ ! -f tools/bundle_ttnn_runtime_libs.py ]; then
            git show origin/main:tools/bundle_ttnn_runtime_libs.py > tools/bundle_ttnn_runtime_libs.py
          fi
          if [ ! -f tools/check_ttnn_elf_invariant.py ]; then
            git show origin/main:tools/check_ttnn_elf_invariant.py > tools/check_ttnn_elf_invariant.py
          fi
          test -f tools/repack_ttnn_shutov_wheel.py
          test -f tools/retag_wheel_platform.py
          test -f tools/bundle_ttnn_runtime_libs.py
          test -f tools/check_ttnn_elf_invariant.py

      - name: Free disk on runner
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build manylinux image from Dockerfile.manylinux
        run: |
          set -euxo pipefail
          docker build \
            -f dockerfile/Dockerfile.manylinux \
            --build-arg OMPI_MAKE_JOBS=2 \
            -t tt-metal-manylinux:ci \
            --progress=plain \
            .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel / twine / wheel
        run: |
          set -euxo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install "cibuildwheel==2.23.2" twine wheel

      - name: Build ttnn wheel (cibuildwheel cp310, no auditwheel)
        env:
          CIBW_BUILD: "cp310-manylinux_x86_64*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BUILD_FRONTEND: build
          CIBW_BUILD_TYPE: Release
          CIBW_ENABLE_TRACY: "OFF"
          # Copy-only tracy repair (no auditwheel, no patchelf).
          # Bundler also writes UNREPAIRED.<wheel> into {dest_dir}; cibuildwheel
          # only persists {dest_dir}/*.whl via /output (not /project writes).
          CIBW_REPAIR_WHEEL_COMMAND: >-
            python3 /project/tools/bundle_ttnn_runtime_libs.py {wheel} --dest-dir {dest_dir}
          CIBW_ENVIRONMENT: >-
            CMAKE_BUILD_PARALLEL_LEVEL=2
            NINJAFLAGS=-j2
            CIBW_BUILD_TYPE=Release
            CIBW_ENABLE_TRACY=OFF
          CIBW_BEFORE_BUILD: "mkdir -p /tmp/ccache && ccache -z || true"
          CIBW_TEST_SKIP: "*"
          CIBW_MANYLINUX_X86_64_IMAGE: tt-metal-manylinux:ci
          CIBW_CONTAINER_ENGINE: "docker; create_args: --memory=28g --memory-swap=40g --cpus=4"
        run: |
          set -euxo pipefail
          python3 -m cibuildwheel --platform linux
          mkdir -p wheelhouse-raw
          # Split unrepaired twin (for ELF gate) from repaired wheelhouse.
          for f in wheelhouse/UNREPAIRED.*.whl; do
            test -f "$f"
            base=$(basename "$f")
            mv "$f" "wheelhouse-raw/${base#UNREPAIRED.}"
          done
          ls -lh wheelhouse/ wheelhouse-raw/
          test -n "$(ls -1 wheelhouse/ttnn-*.whl | head -n 1)"
          test -n "$(ls -1 wheelhouse-raw/ttnn-*.whl | head -n 1)"

      - name: Upload raw wheelhouse (pre-repair, keep on smoke failure)
        uses: actions/upload-artifact@v4
        with:
          name: ttnn-raw-wheelhouse
          path: wheelhouse-raw/
          if-no-files-found: error
          retention-days: 5

      - name: ELF invariant (raw vs repaired)
        run: |
          set -euxo pipefail
          RAW=$(ls -1 wheelhouse-raw/ttnn-*.whl | head -n 1)
          REP=$(ls -1 wheelhouse/ttnn-*.whl | head -n 1)
          python3 tools/check_ttnn_elf_invariant.py \
            --raw-wheel "${RAW}" \
            --repaired-wheel "${REP}"

      - name: Upload repaired wheelhouse (pre-repack)
        uses: actions/upload-artifact@v4
        with:
          name: ttnn-repaired-wheelhouse
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 5

      - name: Smoke import ttnn inside manylinux image
        run: |
          set -euxo pipefail
          SRC=$(ls -1 wheelhouse/ttnn-*.whl | head -n 1)
          # Image default python3 is 3.9; wheel is cp310. Use manylinux CPython 3.10.
          # OpenMPI 5 ULFM from the image (apt OpenMPI 4 lacks MPIX_Comm_revoke).
          docker run --rm \
            -v "$PWD/wheelhouse:/wheels:ro" \
            -e LD_LIBRARY_PATH=/opt/openmpi-v5.0.7-ulfm/lib \
            tt-metal-manylinux:ci \
            bash -lc "
              set -euxo pipefail
              PY=/opt/python/cp310-cp310/bin/python
              test -x \"\$PY\"
              test -e /opt/openmpi-v5.0.7-ulfm/lib/libmpi.so.40
              \"\$PY\" -m pip install --upgrade pip
              \"\$PY\" -m pip install /wheels/$(basename "$SRC")
              \"\$PY\" -c 'import ttnn; print(\"MANYLINUX_SMOKE_OK\", ttnn.__file__)'
            "

      - name: Repack as ttnn-shutov
        run: |
          set -euxo pipefail
          SRC=$(ls -1 wheelhouse/ttnn-*.whl | head -n 1)
          python3 tools/repack_ttnn_shutov_wheel.py \
            --source-wheel "${SRC}" \
            --skip-sha256-check \
            --publish-version "${{ inputs.publish_version }}" \
            --output-dir dist-raw
          ls -lh dist-raw/

      - name: Retag platform to manylinux_2_34_x86_64 (PyPI-accepted)
        run: |
          set -euxo pipefail
          mkdir -p dist
          SRC=$(ls -1 dist-raw/ttnn_shutov-*.whl | head -n 1)
          python3 tools/retag_wheel_platform.py \
            --input "${SRC}" \
            --platform-tag manylinux_2_34_x86_64 \
            --output-dir dist
          ls -lh dist/
          python3 -m twine check dist/*.whl

      - name: Upload ttnn-shutov artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttnn-shutov-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build-repack
    if: ${{ inputs.publish_target == 'testpypi' }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ttnn-shutov-distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TESTPYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true

  publish-pypi:
    needs: build-repack
    if: ${{ inputs.publish_target == 'pypi' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ttnn-shutov-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
